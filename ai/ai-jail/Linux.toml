# ai-jail-managed: rendered by ai/bootstrap.sh from ai/ai-jail/Linux.toml in
# the private dotfiles — edit it there and re-run, or delete this line to keep
# local edits (bootstrap then leaves the file alone).
#
# Accident prevention, not a security boundary. What the agent can reach:
#   project dir (rw), Claude state, gh + ssh (to push/open PRs), network,
#   ai-memory, Node/npx and uv, ~/.config/ai-mcp (read-only).
# Deliberately NOT mapped: ~/.aws (the AWS MCPs use the separate read-only
# credentials in ~/.config/ai-mcp/aws) and the rest of $HOME.
# codebase-memory-mcp: its index cache and daemon rendezvous are relocated
# (CBM_CACHE_DIR / CBM_RUNTIME_DIR, see settings.Linux.json) to ~/.local/state/codebase-memory-mcp,
# mapped read-write below, so jailed and unjailed sessions share one daemon
# and one index.
# ai-jail mounts its own /etc/hosts (localhost and its ai-sandbox hostname),
# which drops openbao.local. bootstrap writes ~/.config/ai-jail/hosts with
# those lines plus the host's openbao.local entry, mapped over it below.
# /run is a private tmpfs, so the moshi-hook socket is mapped by itself.
# Validated on WSL2 (Ubuntu 24.04, kernel 6.18, bubblewrap 0.9.0) on 2026-10-05:
# every MCP connects, Claude is logged in, one shared CBM daemon.

no_save_config = true
__ENV_FROM_FILE__

[commands.claude]
network = true
# ai-jail ignores `worktree`; this is the key that exposes a linked worktree's Git dir.
no_worktree = false
github = true
ssh = true
ro_maps = [
  "__HOME__/.config/ai-jail/hosts:/etc/hosts",
  "__DOTFILES__/openbao",
  "__RUNTIME_DIR__/moshi-hook.sock",
  "__HOME__/.local/opt/ai-memory",
  "__HOME__/.config/ai-memory",
  "__HOME__/.local/bin",
  "__HOME__/.nvm",
  "__HOME__/.config/ai-mcp",
  "__HOME__/.config/ai",
  "__HOME__/.config/openbao",
  "__HOME__/.vault-token",
  "__HOME__/.local/share/ai-tools",
  "__HOME__/.cache/ms-playwright",
]
rw_maps = [
  "__HOME__/.pi",
  "__HOME__/.local/state/codebase-memory-mcp",
  "__HOME__/.local/share/ai-memory",
  "__HOME__/.local/share/uv",
]

[commands.pi]
network = true
no_worktree = false
github = true
ssh = true
# Pi owns its footer and needs OSC 52 for terminal clipboard access.
no_status_bar = true
terminal_passthrough = true
env_pass = ["HERDR_PANE_ID", "PI_CLIPBOARD_OSC52"]
ro_maps = [
  "__AI_DIR__/pi",
  "__HOME__/.local/share/claude",
  "__HOME__/.config/ai-jail/hosts:/etc/hosts",
  "__DOTFILES__/openbao",
  "__RUNTIME_DIR__/moshi-hook.sock",
  "__HOME__/.local/opt/ai-memory",
  "__HOME__/.config/ai-memory",
  "__HOME__/.local/bin",
  "__HOME__/.nvm",
  "__HOME__/.config/ai-mcp",
  "__HOME__/.config/ai",
  "__HOME__/.config/openbao",
  "__HOME__/.vault-token",
  "__HOME__/.local/share/ai-tools",
  "__HOME__/.cache/ms-playwright",
]
rw_maps = [
  "__HOME__/.pi",
  # Share provider sessions instead of copying tokens; allow login refreshes.
  "__HOME__/.claude",
  "__HOME__/.claude.json",
  "__HOME__/.claude-pessoal",
  "__HOME__/.codex",
  "__HOME__/.local/state/codebase-memory-mcp",
  "__HOME__/.local/share/ai-memory",
  "__HOME__/.local/share/uv",
]
