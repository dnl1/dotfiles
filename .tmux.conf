# One window per worktree: nt / nti / rv (~/.config/zsh/devenv.zsh) open
# dev/<branch> and rev/PR-<n> windows; wtdone closes them.

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Keep the names the helpers give windows; programs (Claude Code included)
# would otherwise retitle them.
set -g allow-rename off
setw -g automatic-rename off

# Plugins — prefix + I installs, prefix + U updates.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
